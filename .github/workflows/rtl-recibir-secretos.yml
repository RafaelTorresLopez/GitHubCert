name: RTL - Recibir secretos

on:
  workflow_call:

permissions: {}

jobs:
  comprobar:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar secreto recibido
        shell: bash
        env:
          SECRETO_RECIBIDO: ${{ secrets.RTL_SECRETO_PRUEBA }}
        run: |
          if [ -z "$SECRETO_RECIBIDO" ]; then
            echo "ERROR: el secreto no existe o no se ha recibido."
            exit 1
          fi

          if [ "$SECRETO_RECIBIDO" != "hola-desde-github" ]; then
            echo "ERROR: se ha recibido un valor distinto del esperado."
            exit 1
          fi

          echo "OK: secreto recibido y valor comprobado."
