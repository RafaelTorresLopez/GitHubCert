name: Share data between jobs

on: push

jobs:
  job_1:
    name: Upload File
    runs-on: ubuntu-latest

    steps:
      - name: Crear el archivo
        run: |
          mkdir -p files
          echo "Hello World" > files/file.txt

      - name: Subir el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: file
          path: files/file.txt
          if-no-files-found: error

  job_2:
    name: Download File
    runs-on: ubuntu-latest
    needs: job_1

    steps:
      - name: Descargar el artefacto
        uses: actions/download-artifact@v4
        with:
          name: file
          path: files

      - name: Mostrar el contenido
        run: cat files/file.txt